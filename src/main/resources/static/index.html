<!DOCTYPE html>
<html>
<head>
    <title>Sewer Inspection System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
        }

        button {
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #eeeeee;
        }
    </style>
</head>

<body>

<h1>Autonomous Sewer Inspection System</h1>

<h2>Add Inspection</h2>

<input type="text" id="location" placeholder="Location">

<input type="text" id="issue" placeholder="Issue">

<select id="status">
    <option value="Pending">Pending</option>
    <option value="Completed">Completed</option>
</select>

<button onclick="addInspection()">Add Inspection</button>

<h2>Inspection Records</h2>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Location</th>
            <th>Issue</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="inspectionTable">
    </tbody>
</table>

<script>

function loadInspections() {

    fetch('/inspections')
        .then(response => response.json())
        .then(data => {

            let table = document.getElementById("inspectionTable");

            table.innerHTML = "";

            data.forEach(item => {

                table.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.location}</td>
                        <td>${item.issue}</td>
                        <td>${item.status}</td>

                        <td>
                            <button onclick="editInspection(
                                ${item.id},
                                '${item.location}',
                                '${item.issue}',
                                '${item.status}'
                            )">
                                Edit
                            </button>

                            <button onclick="deleteInspection(${item.id})">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
            });
        });
}


function addInspection() {

    let location = document.getElementById("location").value;
    let issue = document.getElementById("issue").value;
    let status = document.getElementById("status").value;

    if (location === "" || issue === "") {
        alert("Please enter Location and Issue");
        return;
    }

    fetch('/inspections', {

        method: 'POST',

        headers: {
            'Content-Type': 'application/json'
        },

        body: JSON.stringify({
            location: location,
            issue: issue,
            status: status
        })

    })
    .then(response => response.json())
    .then(() => {

        document.getElementById("location").value = "";
        document.getElementById("issue").value = "";

        loadInspections();
    });
}


function editInspection(id, location, issue, status) {

    let newLocation = prompt("Enter Location:", location);

    if (newLocation === null) return;

    let newIssue = prompt("Enter Issue:", issue);

    if (newIssue === null) return;

    let newStatus = prompt(
        "Enter Status (Pending / Completed):",
        status
    );

    if (newStatus === null) return;

    fetch('/inspections/' + id, {

        method: 'PUT',

        headers: {
            'Content-Type': 'application/json'
        },

        body: JSON.stringify({
            location: newLocation,
            issue: newIssue,
            status: newStatus
        })

    })
    .then(response => response.json())
    .then(() => {
        loadInspections();
    });
}


function deleteInspection(id) {

    if (!confirm("Are you sure you want to delete this inspection?")) {
        return;
    }

    fetch('/inspections/' + id, {
        method: 'DELETE'
    })
    .then(() => {
        loadInspections();
    });
}


loadInspections();

</script>

</body>
</html>
